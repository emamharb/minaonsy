<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>دخول المشرف | Mina Onsy Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/style.css?v=theme17">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Cairo', sans-serif;
      background: #f4f6fa;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .auth-shell {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
    }

    .auth-card {
      background: #ffffff;
      border-radius: 28px;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
      border: 1px solid #e9edf2;
      transition: box-shadow 0.3s ease;
    }

    .auth-card:hover {
      box-shadow: 0 24px 72px rgba(0, 0, 0, 0.12);
    }

    .auth-card .eyebrow {
      color: #c89b3c;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 0.25rem;
      text-align: center;
    }

    .auth-card h1 {
      font-size: 1.8rem;
      font-weight: 800;
      color: #0f172a;
      text-align: center;
      margin-bottom: 2rem;
    }

    .auth-card label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      color: #334155;
      margin-bottom: 1.25rem;
      position: relative;
    }

    .auth-card label .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .auth-card label .input-wrapper i {
      position: absolute;
      inset-inline-end: 14px;
      color: #94a3b8;
      font-size: 1rem;
      pointer-events: none;
      transition: color 0.2s ease;
    }

    .auth-card label .input-wrapper input {
      font-family: 'Cairo', sans-serif;
      width: 100%;
      padding: 0.85rem 2.8rem 0.85rem 1rem;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      font-size: 0.95rem;
      background: #fafbfc;
      transition: all 0.2s ease;
      color: #0f172a;
    }

    .auth-card label .input-wrapper input:focus {
      outline: none;
      border-color: #c89b3c;
      box-shadow: 0 0 0 4px rgba(200, 155, 60, 0.12);
      background: #ffffff;
    }

    .auth-card label .input-wrapper input:focus + i,
    .auth-card label .input-wrapper input:focus ~ i {
      color: #c89b3c;
    }

    .auth-card .button.primary {
      width: 100%;
      background: #0f172a;
      color: #fff;
      border: none;
      padding: 0.9rem;
      border-radius: 14px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: 'Cairo', sans-serif;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 0.5rem;
    }

    .auth-card .button.primary:hover {
      background: #c89b3c;
      color: #0f172a;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(200, 155, 60, 0.3);
    }

    .auth-card .button.primary:active {
      transform: translateY(0);
    }

    .auth-card .muted {
      margin-top: 1.2rem;
      text-align: center;
      font-size: 0.9rem;
      color: #dc2626;
      min-height: 1.5rem;
    }

    @media (max-width: 480px) {
      body {
        padding: 1rem;
        align-items: flex-start;
        padding-top: 3rem;
      }
      .auth-card {
        padding: 2rem 1.5rem;
        border-radius: 24px;
      }
      .auth-card h1 {
        font-size: 1.5rem;
      }
      .auth-card label .input-wrapper input {
        padding: 0.75rem 2.6rem 0.75rem 1rem;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <main class="auth-shell">
    <form id="loginForm" class="auth-card">
      <p class="eyebrow"><i class="fas fa-crown" style="margin-left:6px;"></i> Mina Onsy Studio</p>
      <h1>تسجيل الدخول</h1>

      <label>
        البريد الإلكتروني
        <div class="input-wrapper">
          <input required type="email" name="email" placeholder="example@email.com">
          <i class="fas fa-envelope"></i>
        </div>
      </label>

      <label>
        كلمة المرور
        <div class="input-wrapper">
          <input required type="password" name="password" placeholder="••••••••">
          <i class="fas fa-lock"></i>
        </div>
      </label>

      <button class="button primary" type="submit">
        <i class="fas fa-sign-in-alt"></i> دخول
      </button>

      <p id="loginError" class="muted"></p>
    </form>
  </main>

  <script src="../assets/js/language.js?v=language8"></script>
  <script>
    (function() {
      // لا نقوم بأي تعديل على منطق الدخول، نتركه كما هو في admin-auth.js
    })();
  </script>

  <script type="module" src="../assets/js/admin-auth.js"></script>
</body>
</html>
