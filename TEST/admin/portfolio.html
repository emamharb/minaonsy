<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إدارة البورتفوليو | Mina Onsy Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/style.css?v=editorial2">
  <link rel="stylesheet" href="../assets/css/admin-editorial.css?v=3">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body.admin-body {
      font-family: 'Cairo', sans-serif;
      background: #f4f6fa;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      align-items: stretch;
      text-align: right;
    }

    .admin-layout {
      display: flex;
      width: 100%;
      min-height: 100vh;
    }

    .admin-sidebar {
      width: 260px;
      background: #0f172a;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      border-right: 1px solid #1e293b;
      transition: transform 0.3s ease;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .brand-mark {
      background: #c89b3c;
      color: #0f172a;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.2rem;
    }

    .admin-sidebar nav {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .admin-sidebar nav a {
      color: #cbd5e1;
      text-decoration: none;
      padding: 12px 16px;
      border-radius: 10px;
      font-weight: 600;
      transition: all 0.2s ease;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .admin-sidebar nav a i {
      width: 20px;
      text-align: center;
    }

    .admin-sidebar nav a:hover {
      background: #1e293b;
      color: #f8fafc;
    }

    .admin-sidebar nav a.active {
      background: #c89b3c;
      color: #0f172a;
      box-shadow: 0 4px 12px rgba(200, 155, 60, 0.3);
    }

    .admin-sidebar nav button#logoutBtn {
      margin-top: auto;
      background: transparent;
      border: 2px solid #ef4444;
      color: #fca5a5;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Cairo', sans-serif;
      width: 100%;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .admin-sidebar nav button#logoutBtn:hover {
      background: #ef4444;
      color: #fff;
      border-color: #ef4444;
      box-shadow: 0 4px 16px rgba(239, 68, 68, 0.4);
    }

    .admin-main {
      flex: 1;
      padding: 2rem 2.5rem;
      background: #f4f6fa;
      min-height: 100vh;
    }

    .admin-top {
      margin-bottom: 2.5rem;
    }

    .admin-top .eyebrow {
      color: #475569;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .admin-top h1 {
      font-size: 2rem;
      font-weight: 800;
      color: #0f172a;
      margin: 0;
    }

    .admin-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 1.8rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      border: 1px solid #e9edf2;
      transition: box-shadow 0.2s ease;
      margin-bottom: 2rem;
    }

    .admin-card:hover {
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.07);
    }

    .admin-card h2 {
      font-size: 1.2rem;
      font-weight: 700;
      color: #0f172a;
      margin-top: 0;
      margin-bottom: 1.5rem;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .admin-card h2 i {
      color: #c89b3c;
    }

    .dropzone {
      border: 3px dashed #d1d5db;
      border-radius: 20px;
      padding: 3.5rem 2rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      background: #fafbfc;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      align-items: center;
      justify-content: center;
    }

    .dropzone:hover {
      border-color: #c89b3c;
      background: #fcf8f0;
    }

    .dropzone.is-dragging {
      border-color: #c89b3c;
      background: #fcf8f0;
      box-shadow: 0 0 0 8px rgba(200, 155, 60, 0.08);
    }

    .dropzone:focus-visible {
      outline: 3px solid #c89b3c;
      outline-offset: 4px;
    }

    .dropzone strong {
      font-size: 1.2rem;
      color: #0f172a;
    }

    .dropzone span {
      color: #475569;
      font-size: 0.95rem;
    }

    .dropzone i {
      font-size: 3.5rem;
      color: #c89b3c;
      margin-bottom: 0.25rem;
    }

    .progress-list {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .progress-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #f8fafc;
      border: 1px solid #eef2f7;
      border-radius: 12px;
      padding: 0.75rem 1rem;
    }

    .progress-item strong {
      font-size: 0.85rem;
      color: #0f172a;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .progress-item span {
      display: block;
      position: relative;
      height: 8px;
      border-radius: 30px;
      background: #e2e8f0;
      overflow: hidden;
      color: transparent;
      font-size: 0;
    }

    .progress-item span::before {
      content: "";
      position: absolute;
      inset: 0;
      right: auto;
      width: var(--progress, 0%);
      background: #c89b3c;
      border-radius: 30px;
      transition: width 0.3s ease;
    }

    .progress-item small {
      color: #475569;
      font-size: 0.78rem;
    }

    .progress-item.is-done small {
      color: #15803d;
      font-weight: 600;
    }

    .progress-item.is-error small {
      color: #dc2626;
      font-weight: 600;
    }

    .progress-item.is-error span::before {
      background: #dc2626;
    }

    .progress-item.is-done span::before {
      background: #15803d;
    }

    .status-message.success {
      color: #15803d;
    }

    .status-message.error {
      color: #dc2626;
    }

    .thumb-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 1.25rem;
      margin-top: 0.5rem;
    }

    .thumb-card {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      background: #f1f5f9;
      border: 2px solid #e9edf2;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
    }

    .thumb-card:hover {
      border-color: #c89b3c;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      transform: scale(1.02);
    }

    .thumb-card img,
    .thumb-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #f1f5f9;
    }

    .thumb-card video {
      background: #000;
    }

    .thumb-card .thumb-actions {
      position: absolute;
      bottom: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      gap: 6px;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .thumb-card:hover .thumb-actions {
      opacity: 1;
    }

    .thumb-card .thumb-actions button {
      font-size: 0.75rem;
      padding: 0.35rem 0.7rem;
      background: rgba(15, 23, 42, 0.85);
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      font-weight: 600;
      transition: background 0.2s;
    }

    .thumb-card .thumb-actions button:hover {
      background: rgba(200, 155, 60, 0.9);
    }

    .thumb-card .thumb-actions button.danger:hover {
      background: #dc2626;
    }

    .thumb-card .card-status {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(15, 23, 42, 0.8);
      color: #fff;
      font-size: 0.7rem;
      padding: 2px 10px;
      border-radius: 20px;
      font-weight: 600;
    }

    .thumb-card .card-status:empty {
      display: none;
    }

    .hamburger-btn {
      display: none;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1.6rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .hamburger-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    @media (max-width: 1024px) {
      .admin-sidebar {
        width: 220px;
        padding: 1.5rem 1rem;
      }
    }

    @media (max-width: 768px) {
      .admin-layout {
        flex-direction: column;
      }

      .admin-sidebar {
        width: 100%;
        height: auto;
        position: relative;
        padding: 1rem 1.5rem;
        flex-direction: row;
        flex-wrap: wrap;
        gap: 0.8rem;
        align-items: center;
        border-right: none;
        border-bottom: 1px solid #1e293b;
        transform: none;
      }

      .admin-sidebar .brand {
        flex: 1;
      }

      .hamburger-btn {
        display: block;
        order: 2;
      }

      .admin-sidebar nav {
        display: none;
        flex-direction: column;
        width: 100%;
        order: 3;
        gap: 6px;
        padding-top: 0.5rem;
        border-top: 1px solid #1e293b;
        margin-top: 0.5rem;
      }

      .admin-sidebar nav.open {
        display: flex;
      }

      .admin-sidebar nav a {
        padding: 10px 14px;
        font-size: 0.9rem;
      }

      .admin-sidebar nav button#logoutBtn {
        margin-top: 0;
        width: 100%;
      }

      .admin-main {
        padding: 1rem;
      }

      .admin-top h1 {
        font-size: 1.6rem;
      }

      .admin-card {
        padding: 1.2rem;
      }

      .dropzone {
        padding: 2rem 1.5rem;
      }

      .dropzone i {
        font-size: 2.5rem;
      }

      .thumb-grid {
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 0.75rem;
      }
    }

    @media (max-width: 480px) {
      .admin-sidebar nav a i {
        width: 18px;
      }

      .thumb-grid {
        grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
        gap: 0.5rem;
      }
    }
  </style>
</head>
<body class="admin-body">
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="brand">
        <span class="brand-mark">MO</span>
        <span>Mina Onsy</span>
      </div>
      <div class="admin-preferences" aria-label="Display preferences">
        <button class="admin-language-toggle" type="button" data-admin-language-toggle aria-label="Switch to Arabic">العربية</button>
        <button class="admin-theme-toggle" type="button" data-admin-theme-toggle aria-label="Switch to light theme"><i class="fas fa-sun" aria-hidden="true"></i></button>
      </div>
      <button class="hamburger-btn" id="hamburgerBtn" aria-label="فتح القائمة"><i class="fas fa-bars"></i></button>
      <nav id="sidebarNav">
        <a href="dashboard.html"><i class="fas fa-images"></i>المعارض</a>
        <a class="active" href="portfolio.html"><i class="fas fa-th"></i>البورتفوليو</a>
        <a href="storage.html"><i class="fas fa-database"></i>المساحة</a>
        <a href="trash.html"><i class="fas fa-trash"></i>سلة المهملات</a>
        <button id="logoutBtn" type="button"><i class="fas fa-sign-out-alt"></i>خروج</button>
      </nav>
    </aside>
    <main class="admin-main">
      <div class="admin-top">
        <div>
          <p class="eyebrow">معرض الأعمال العام</p>
          <h1>البورتفوليو</h1>
        </div>
      </div>
      <section class="admin-card">
        <h2><i class="fas fa-cloud-upload-alt"></i> رفع صور وفيديوهات جديدة</h2>
        <div class="dropzone" id="portfolioDropzone" role="button" tabindex="0">
          <i class="fas fa-upload"></i>
          <strong>اضغط للاختيار، اسحب الملفات هنا، أو الصقها داخل الصفحة</strong>
          <span>يدعم الصور والفيديوهات</span>
          <input id="portfolioFiles" type="file" multiple accept="image/*,video/*" hidden>
        </div>
        <div id="portfolioProgress" class="progress-list"></div>
      </section>
      <section class="admin-card">
        <h2><i class="fas fa-photo-video"></i> الملفات الحالية</h2>
        <div id="portfolioGridAdmin" class="thumb-grid"></div>
      </section>
    </main>
  </div>

  <script src="../assets/js/language.js?v=admin-controls3"></script>
  <script>
    (function() {
      var hamburger = document.getElementById('hamburgerBtn');
      var nav = document.getElementById('sidebarNav');
      if (hamburger && nav) {
        hamburger.addEventListener('click', function(e) {
          e.stopPropagation();
          nav.classList.toggle('open');
        });
        document.addEventListener('click', function(e) {
          if (window.innerWidth <= 768) {
            var sidebar = document.querySelector('.admin-sidebar');
            if (sidebar && !sidebar.contains(e.target)) {
              nav.classList.remove('open');
            }
          }
        });
        nav.querySelectorAll('a, button').forEach(function(el) {
          el.addEventListener('click', function() {
            if (window.innerWidth <= 768) {
              nav.classList.remove('open');
            }
          });
        });
      }
      var dropzone = document.getElementById('portfolioDropzone');
      var fileInput = document.getElementById('portfolioFiles');
      if (dropzone && fileInput) {
        dropzone.addEventListener('dragover', function(e) {
          e.preventDefault();
          dropzone.style.borderColor = '#c89b3c';
          dropzone.style.background = '#fcf8f0';
        });
        dropzone.addEventListener('dragleave', function(e) {
          e.preventDefault();
          dropzone.style.borderColor = '#d1d5db';
          dropzone.style.background = '#fafbfc';
        });
        dropzone.addEventListener('drop', function(e) {
          e.preventDefault();
          dropzone.style.borderColor = '#d1d5db';
          dropzone.style.background = '#fafbfc';
          if (e.dataTransfer.files.length) {
            fileInput.files = e.dataTransfer.files;
            var event = new Event('change', { bubbles: true });
            fileInput.dispatchEvent(event);
          }
        });
      }
    })();
  </script>

  <script type="module" src="../assets/js/admin-portfolio.js"></script>
</body>
</html>
