<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>المساحة التخزينية | Mina Onsy Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/style.css?v=editorial2">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body.admin-body {
      font-family: 'Cairo', sans-serif;
      background: #f4f6fa;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      align-items: stretch;
      text-align: right;
    }

    .admin-layout {
      display: flex;
      width: 100%;
      min-height: 100vh;
    }

    .admin-sidebar {
      width: 260px;
      background: #0f172a;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      border-right: 1px solid #1e293b;
      transition: transform 0.3s ease;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .brand-mark {
      background: #c89b3c;
      color: #0f172a;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.2rem;
    }

    .admin-sidebar nav {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .admin-sidebar nav a {
      color: #cbd5e1;
      text-decoration: none;
      padding: 12px 16px;
      border-radius: 10px;
      font-weight: 600;
      transition: all 0.2s ease;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .admin-sidebar nav a i {
      width: 20px;
      text-align: center;
    }

    .admin-sidebar nav a:hover {
      background: #1e293b;
      color: #f8fafc;
    }

    .admin-sidebar nav a.active {
      background: #c89b3c;
      color: #0f172a;
      box-shadow: 0 4px 12px rgba(200, 155, 60, 0.3);
    }

    .admin-sidebar nav button#logoutBtn {
      margin-top: auto;
      background: transparent;
      border: 2px solid #ef4444;
      color: #fca5a5;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Cairo', sans-serif;
      width: 100%;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .admin-sidebar nav button#logoutBtn:hover {
      background: #ef4444;
      color: #fff;
      border-color: #ef4444;
      box-shadow: 0 4px 16px rgba(239, 68, 68, 0.4);
    }

    .admin-main {
      flex: 1;
      padding: 2rem 2.5rem;
      background: #f4f6fa;
      min-height: 100vh;
    }

    .admin-top {
      margin-bottom: 2.5rem;
    }

    .admin-top .eyebrow {
      color: #334155;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .admin-top h1 {
      font-size: 2rem;
      font-weight: 800;
      color: #0f172a;
      margin: 0;
    }

    .admin-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 1.8rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      border: 1px solid #e9edf2;
      transition: box-shadow 0.2s ease;
      margin-bottom: 2rem;
    }

    .admin-card:hover {
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.07);
    }

    .admin-card h2 {
      font-size: 1.2rem;
      font-weight: 700;
      color: #0f172a;
      margin-top: 0;
      margin-bottom: 1.5rem;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .admin-card h2 i {
      color: #c89b3c;
    }

    .storage-page {
      display: grid;
      gap: 18px;
    }

    .storage-metric {
      background: #fafbfc;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 1.8rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      transition: border-color 0.2s;
    }

    .storage-metric:hover {
      border-color: #c89b3c;
    }

    .storage-metric-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .storage-metric-head strong {
      font-size: 1.1rem;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .storage-metric-head strong i {
      color: #c89b3c;
    }

    .storage-metric-head .percentage,
    .storage-metric-head span {
      font-weight: 700;
      color: #c89b3c;
      font-size: 1.2rem;
    }

    .storage-metric-bar {
      width: 100%;
      height: 18px;
      border-radius: 999px;
      overflow: hidden;
      background: #e9edf2;
      border: 1px solid #d8e0ea;
    }

    .storage-metric-bar span {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #d4af37, #c89b3c);
      transition: width 0.6s ease;
    }

    .storage-metric-foot {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 0.9rem;
    }

    .storage-metric-foot .muted {
      color: #334155;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }

    .storage-metric-foot .muted i {
      color: #94a3b8;
      font-size: 0.8rem;
    }

    .hamburger-btn {
      display: none;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1.6rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .hamburger-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    @media (max-width: 1024px) {
      .admin-sidebar {
        width: 220px;
        padding: 1.5rem 1rem;
      }
      .admin-main {
        padding: 1.5rem;
      }
    }

    @media (max-width: 768px) {
      .admin-layout {
        flex-direction: column;
      }
      .admin-sidebar {
        width: 100%;
        height: auto;
        position: relative;
        padding: 1rem 1.5rem;
        flex-direction: row;
        flex-wrap: wrap;
        gap: 0.8rem;
        align-items: center;
        border-right: none;
        border-bottom: 1px solid #1e293b;
        transform: none;
      }
      .admin-sidebar .brand {
        flex: 1;
      }
      .hamburger-btn {
        display: block;
        order: 2;
      }
      .admin-sidebar nav {
        display: none;
        flex-direction: column;
        width: 100%;
        order: 3;
        gap: 6px;
        padding-top: 0.5rem;
        border-top: 1px solid #1e293b;
        margin-top: 0.5rem;
      }
      .admin-sidebar nav.open {
        display: flex;
      }
      .admin-sidebar nav a {
        padding: 10px 14px;
        font-size: 0.9rem;
      }
      .admin-sidebar nav button#logoutBtn {
        margin-top: 0;
        width: 100%;
        padding: 10px 14px;
      }
      .admin-main {
        padding: 1rem;
      }
      .admin-top h1 {
        font-size: 1.6rem;
      }
      .admin-card {
        padding: 1.2rem;
      }
      .storage-metric {
        padding: 1.2rem;
      }
      .storage-metric-head {
        flex-direction: column;
        align-items: stretch;
        gap: 0.5rem;
      }
      .storage-metric-head .percentage {
        text-align: left;
      }
    }

    @media (max-width: 480px) {
      .admin-sidebar nav a i {
        width: 18px;
      }
      .storage-metric-foot {
        flex-direction: column;
        gap: 0.4rem;
      }
    }
  </style>
</head>
<body class="admin-body">
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="brand">
        <span class="brand-mark">MO</span>
        <span>Mina Onsy</span>
      </div>
      <button class="hamburger-btn" id="hamburgerBtn" aria-label="فتح القائمة"><i class="fas fa-bars"></i></button>
      <nav id="sidebarNav">
        <a href="dashboard.html"><i class="fas fa-images"></i>المعارض</a>
        <a href="portfolio.html"><i class="fas fa-th"></i>البورتفوليو</a>
        <a class="active" href="storage.html"><i class="fas fa-database"></i>المساحة</a>
        <a href="trash.html"><i class="fas fa-trash"></i>سلة المهملات</a>
        <button id="logoutBtn" type="button"><i class="fas fa-sign-out-alt"></i>خروج</button>
      </nav>
    </aside>
    <main class="admin-main">
      <div class="admin-top">
        <div>
          <p class="eyebrow">إدارة التخزين</p>
          <h1>المساحة</h1>
        </div>
      </div>
      <section class="admin-card">
        <h2><i class="fas fa-database"></i> المساحة التخزينية</h2>
        <div class="storage-page">
          <div id="storageQuotaPage" class="storage-metric">
            <div class="storage-metric-head">
              <strong><i class="fas fa-chart-pie"></i> جاري تحميل المساحة...</strong>
              <span class="percentage">0%</span>
            </div>
            <div class="storage-metric-bar"><span style="width:0%"></span></div>
            <div class="storage-metric-foot">
              <span class="muted"><i class="fas fa-check-circle"></i> المستخدم: --</span>
              <span class="muted"><i class="fas fa-circle"></i> المتاح: --</span>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="../assets/js/language.js?v=language11"></script>
  <script>
    (function() {
      var hamburger = document.getElementById('hamburgerBtn');
      var nav = document.getElementById('sidebarNav');
      if (hamburger && nav) {
        hamburger.addEventListener('click', function(e) {
          e.stopPropagation();
          nav.classList.toggle('open');
        });
        document.addEventListener('click', function(e) {
          if (window.innerWidth <= 768) {
            var sidebar = document.querySelector('.admin-sidebar');
            if (sidebar && !sidebar.contains(e.target)) {
              nav.classList.remove('open');
            }
          }
        });
        nav.querySelectorAll('a, button').forEach(function(el) {
          el.addEventListener('click', function() {
            if (window.innerWidth <= 768) {
              nav.classList.remove('open');
            }
          });
        });
      }
    })();
  </script>

  <script type="module" src="../assets/js/storage-admin.js"></script>
</body>
</html>
